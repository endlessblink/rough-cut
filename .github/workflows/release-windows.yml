name: Windows release build

# Builds the Windows installer and portable zip on GitHub's Windows machine and attaches them, with checksums and the
# UNSIGNED update file, to a DRAFT release. Nothing is published and nothing is signed here: the owner signs beta.yml
# on his own PC (scripts/sign-owner-release.sh) and publishes. A release that is already published is never touched.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.1.0-beta.12 (must match apps/desktop/package.json)'
        required: true
      dry_run:
        description: 'Build and keep the files as a workflow artifact only; touch no release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-windows-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Version matches the app
        shell: pwsh
        run: |
          $appVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($appVersion -ne $env:VERSION) { throw "Asked for $env:VERSION but the app says $appVersion." }

      - name: Refuse to touch a published release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $json = gh release view $env:TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and -not ($json | ConvertFrom-Json).isDraft) { throw "$env:TAG is already published; nothing was changed." }
          exit 0

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/prepare-windows-tools.mjs
      - run: node scripts/package-windows.mjs
      - run: node scripts/build-windows-release.mjs

      - name: Checksums and unsigned update file
        shell: pwsh
        run: |
          $dir = 'release/windows'
          $setup = "Rough-Cut-$env:VERSION-Setup.exe"
          $zip = "Rough-Cut-$env:VERSION-win-x64.zip"
          foreach ($f in @($setup, $zip)) { if (-not (Test-Path "$dir/$f")) { throw "Missing $f" } }
          $lines = foreach ($f in @($setup, $zip)) { "{0} *{1}" -f (Get-FileHash "$dir/$f" -Algorithm SHA256).Hash.ToLower(), $f }
          Set-Content -Path "$dir/SHA256SUMS-windows-$($env:VERSION -replace '^.*-', '').txt" -Value $lines -NoNewline:$false
          node scripts/release-metadata.mjs prepare --platform win32 --version $env:VERSION --installer (Resolve-Path "$dir/$setup") --output "$dir/unsigned-win.json"
          Get-ChildItem $dir -File | Format-Table Name, Length

      - name: Keep the files (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ inputs.version }}
          path: |
            release/windows/Rough-Cut-*-Setup.exe
            release/windows/Rough-Cut-*-win-x64.zip
            release/windows/SHA256SUMS-windows-*.txt
            release/windows/unsigned-win.json
          retention-days: 3

      - name: Attach to the draft release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $dir = 'release/windows'
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --draft --prerelease --target $env:GITHUB_SHA --title "Rough Cut $env:VERSION (Linux and Windows)" --notes "Draft. Windows files built by GitHub Actions from $env:GITHUB_SHA; Linux files and signed update files are added by the owner before publishing."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }
          }
          $files = Get-ChildItem $dir -File | Where-Object { $_.Name -like "Rough-Cut-$env:VERSION-*" -or $_.Name -like 'SHA256SUMS-windows-*' -or $_.Name -eq 'unsigned-win.json' } | ForEach-Object { $_.FullName }
          gh release upload $env:TAG @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed.' }
